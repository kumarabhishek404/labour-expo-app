name: OTA Update

on:
  push:
    branches:
      - ota

permissions:
  contents: write

jobs:
  ota_update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          token: ${{ secrets.EXPO_TOKEN }}
          eas-version: latest

      # 2️⃣ OTA publish (NO build)
      - name: Publish OTA Update
        run: |
          eas update \
            --branch production \
            --platform android \
            --message "OTA update from GitHub" \
            --non-interactive
